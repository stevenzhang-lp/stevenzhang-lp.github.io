<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>STEVEN ZHANG | 思维碎片 (Thought Fragments)</title>
	
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Noto+Serif+SC:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
	
	<link rel="stylesheet" href="css/main.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex-swap.min.css" integrity="sha384-K1TI7Ktijrt7j4OXUE01l7B+930e+/TANYDr7BOcY1nzek+4rm/Bew0vPAFebOVV" crossorigin="anonymous">
	<script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js" integrity="sha384-ycJ6GAwiS15LoUPipwJOrWTvkUHl/YqELValBwI5I4awP1EeEQJYarj+w85ntcz7" crossorigin="anonymous"></script>
	
	<style>
		/* Specific Overrides for Journal Filters */
		.filter-group h4 {
			font-size: 0.85rem;
			text-transform: uppercase;
			letter-spacing: 0.1em;
			color: var(--secondary-text-light);
			margin-bottom: 0.5rem;
		}
		.filter-list {
			list-style: none;
			display: flex;
			gap: 1rem;
			flex-wrap: wrap;
		}
		.filter-list li {
			cursor: pointer;
			opacity: 0.5;
			transition: opacity 0.3s;
			font-size: 0.9rem;
		}
		.filter-list li.active, .filter-list li:hover {
			opacity: 1;
			font-weight: 500;
		}
		
		.journal-sidebar {
			display: flex;
			flex-direction: column;
			gap: 2rem;
			margin-bottom: 3rem;
		}

		.journal-sidebar[hidden] {
			display: none !important;
		}

		@media (min-width: 768px) {
			.journal-sidebar {
				flex-direction: row;
				justify-content: center;
				gap: 4rem;
			}
		}

		.journal-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			width: min(100%, 960px);
			max-width: 960px;
			gap: 1.25rem;
		}

		.journal-grid.is-single {
			grid-template-columns: minmax(0, 1fr);
		}

		.journal-card {
			position: relative;
			display: grid;
			grid-template-columns: minmax(0, 1.25fr) minmax(250px, 0.75fr);
			min-height: 310px;
			overflow: hidden;
			background: linear-gradient(135deg, rgba(19, 24, 38, 0.94), rgba(8, 9, 14, 0.92));
			border: 1px solid rgba(255, 255, 255, 0.12);
			border-radius: 20px;
			box-shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
			transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.35s ease, box-shadow 0.35s ease;
		}

		.journal-card::before {
			position: absolute;
			inset: 0;
			background: radial-gradient(circle at 72% 28%, rgba(81, 104, 255, 0.14), transparent 38%);
			content: '';
			pointer-events: none;
		}

		.journal-card:hover {
			transform: translateY(-5px);
			border-color: rgba(154, 174, 255, 0.38);
			box-shadow: 0 34px 95px rgba(0, 0, 0, 0.46);
		}

		.journal-card-content,
		.journal-project-visual {
			position: relative;
			z-index: 1;
		}

		.journal-card-content {
			display: flex;
			flex-direction: column;
			padding: clamp(1.6rem, 3vw, 2.25rem);
		}

		.journal-card-eyebrow {
			margin-bottom: 1rem;
			color: #9caeff;
			font-size: 0.72rem;
			font-weight: 600;
			letter-spacing: 0.16em;
		}

		.journal-card-title {
			max-width: 650px;
			margin-bottom: 0.7rem;
			font-family: 'Playfair Display', 'Noto Serif SC', serif;
			font-size: clamp(1.65rem, 2.8vw, 2.25rem);
			font-weight: 500;
			letter-spacing: -0.025em;
			line-height: 1.2;
		}

		.journal-inline-math {
			display: inline-flex;
			margin: 0 0.08em;
			font-size: 0.92em;
			vertical-align: -0.06em;
		}

		.journal-inline-math .katex {
			font-size: 1em;
		}

		.journal-card-meta {
			display: flex;
			gap: 0.55rem;
			align-items: center;
			margin-bottom: 1rem;
			color: rgba(255, 255, 255, 0.48);
			font-size: 0.76rem;
			letter-spacing: 0.08em;
		}

		.journal-card-excerpt {
			max-width: 680px;
			margin-bottom: 1.4rem;
			color: rgba(255, 255, 255, 0.7);
			font-size: 0.9rem;
			line-height: 1.75;
		}

		.journal-card-action {
			display: inline-flex;
			align-items: center;
			align-self: flex-start;
			gap: 0.75rem;
			min-height: 42px;
			padding: 0 1rem;
			margin-top: auto;
			color: #fff;
			background: rgba(255, 255, 255, 0.1);
			border: 1px solid rgba(255, 255, 255, 0.14);
			border-radius: 999px;
			font-size: 0.78rem;
			font-weight: 600;
			letter-spacing: 0.1em;
		}

		.journal-card-action-arrow {
			font-size: 1rem;
			transition: transform 0.25s ease;
		}

		.journal-card:hover .journal-card-action-arrow {
			transform: translate(3px, -3px);
		}

		.journal-project-visual {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			min-width: 0;
			padding: clamp(1.5rem, 3vw, 2rem);
			background: linear-gradient(145deg, rgba(87, 103, 222, 0.15), rgba(8, 9, 14, 0.14));
			border-left: 1px solid rgba(255, 255, 255, 0.09);
		}

		.project-visual-label,
		.project-visual-note {
			color: rgba(255, 255, 255, 0.42);
			font-size: 0.68rem;
			letter-spacing: 0.12em;
		}

		.project-equation {
			display: grid;
			place-items: center;
			min-height: 120px;
			padding: 1rem 0;
			color: #fff;
			font-family: 'STIX Two Math', 'Cambria Math', 'Times New Roman', serif;
			font-size: clamp(1.4rem, 2.4vw, 1.95rem);
			line-height: 1.2;
			text-align: center;
			text-shadow: 0 0 34px rgba(124, 151, 255, 0.36);
		}

		.project-equation .katex {
			font-size: 1em;
		}

		.project-equation .katex-display {
			margin: 0;
		}

		@media (max-width: 760px) {
			.journal-grid {
				grid-template-columns: 1fr;
			}

			.journal-card {
				grid-template-columns: 1fr;
			}

			.journal-project-visual {
				min-height: 170px;
				border-top: 1px solid rgba(255, 255, 255, 0.09);
				border-left: 0;
			}
		}

		.empty-container {
			display: none;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 5rem 0;
			text-align: center;
			opacity: 0.5;
		}
	</style>
</head>
<body class="lang-zh">
	
	<!-- Header -->
	<header class="main-header">
		<div class="header-logo">
			<a href="index.html">STEVEN ZHANG</a>
			<span style="opacity: 0.5; margin-left: 1rem; font-size: 0.8rem;">
				<span class="lang-en">| THOUGHT FRAGMENTS</span>
				<span class="lang-zh">| 思维碎片</span>
			</span>
		</div>
		<nav class="header-nav">
			<button id="lang-toggle" class="lang-btn magnetic-btn">
				<span class="lang-en">中文</span>
				<span class="lang-zh">ENGLISH</span>
			</button>
		</nav>
	</header>

	<!-- Deep Space Background (Fixed) -->
	<div class="hero-bg-container">
		<div class="stars-container">
			<div id="stars"></div>
			<div id="stars2"></div>
			<div id="stars3"></div>
			<div id="stars4"></div>
			<div id="stars5"></div>
		</div>
		<div class="hero-bg-orb"></div>
		<div class="hero-bg-overlay"></div>
	</div>

	<!-- Content -->
	<main class="subpage-container">
		
		<div class="subpage-header">
			<h1 class="subpage-title">
				<span class="lang-en">Thought Fragments</span>
				<span class="lang-zh">思维碎片</span>
			</h1>
			<p style="color: var(--secondary-text-light); letter-spacing: 0.1em;">
				<span class="lang-en">Thoughts and reflections.</span>
				<span class="lang-zh">思考与沉淀。</span>
			</p>
		</div>

		<!-- Filters -->
		<aside class="journal-sidebar glass-panel">
			<div class="filter-group">
				<h4>
					<span class="lang-en">Category</span>
					<span class="lang-zh">分类</span>
				</h4>
				<ul class="filter-list" id="category-filter">
					<li data-category="ALL" class="active"><span class="lang-en">All</span><span class="lang-zh">全部</span></li>
					<li data-category="TECH"><span class="lang-en">Tech</span><span class="lang-zh">技术</span></li>
					<li data-category="LIFE"><span class="lang-en">Life</span><span class="lang-zh">生活</span></li>
					<li data-category="ART"><span class="lang-en">Art</span><span class="lang-zh">艺术</span></li>
				</ul>
			</div>
			<div class="filter-group">
				<h4>
					<span class="lang-en">Year</span>
					<span class="lang-zh">年份</span>
				</h4>
				<ul class="filter-list" id="year-filter">
					<li data-year="ALL" class="active"><span class="lang-en">All</span><span class="lang-zh">全部</span></li>
					<li data-year="2026"><span class="lang-en">2026</span><span class="lang-zh">2026</span></li>
				</ul>
			</div>
		</aside>

		<!-- Empty State -->
		<div class="empty-container" id="journal-empty-container">
			<p>
				<span class="lang-en">No thoughts recorded yet.</span>
				<span class="lang-zh">思维沉淀中，暂无记录。</span>
			</p>
		</div>

		<!-- Grid -->
		<section class="journal-grid" id="journal-grid" aria-live="polite" aria-label="思维碎片列表"></section>

	</main>

	<!-- Global Footer -->
	<footer class="site-global-footer">
		<p>&copy; 2026 STEVEN ZHANG. ALL RIGHTS RESERVED.</p>
	</footer>

	<!-- Core Libraries -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
	<!-- Data & App Logic -->
	<script src="js/data.js"></script>
	<script src="js/journal.js"></script>
	<!-- Starfield Parallax -->
	<script src="js/main.js"></script>
</body>
</html>
