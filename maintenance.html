<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>STEVEN ZHANG | Under Maintenance</title>
	
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Noto+Serif+SC:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
	
	<link rel="stylesheet" href="css/main.css">
	
	<style>
		.maintenance-container {
			position: relative;
			z-index: 10;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			text-align: center;
			padding: 2rem;
		}
		
		.maintenance-icon {
			margin-bottom: 2rem;
			color: rgba(255, 255, 255, 0.8);
			animation: pulse 3s infinite alternate;
		}

		@keyframes pulse {
			0% { opacity: 0.5; transform: scale(0.95); }
			100% { opacity: 1; transform: scale(1.05); }
		}
		
		.maintenance-title {
			font-family: 'Playfair Display', serif;
			font-size: clamp(3rem, 8vw, 5rem);
			font-weight: 600;
			line-height: 1.2;
			margin-bottom: 1rem;
			background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.4) 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			letter-spacing: -0.02em;
		}
		
		.maintenance-subtitle {
			font-size: 1.2rem;
			font-weight: 400;
			letter-spacing: 0.2em;
			text-transform: uppercase;
			color: var(--secondary-text-light);
			margin-bottom: 2rem;
		}
		
		.maintenance-desc {
			font-size: 1rem;
			color: #aaa;
			max-width: 500px;
			line-height: 1.8;
			margin-bottom: 3rem;
		}
		
		.status-badge {
			display: inline-block;
			padding: 0.5rem 1.5rem;
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 30px;
			color: var(--secondary-text-light);
			font-size: 0.85rem;
			letter-spacing: 0.1em;
			backdrop-filter: blur(10px);
		}
	</style>
</head>
<body class="lang-zh">
	
	<!-- Header -->
	<header class="main-header">
		<div class="header-logo">
			<a href="#">STEVEN ZHANG</a>
		</div>
		<nav class="header-nav">
			<button id="lang-toggle" class="lang-btn magnetic-btn">
				<span class="lang-en">中文</span>
				<span class="lang-zh">ENGLISH</span>
			</button>
		</nav>
	</header>

	<!-- Deep Space Background -->
	<div class="hero-bg-container">
		<div class="stars-container">
			<div id="stars"></div>
			<div id="stars2"></div>
			<div id="stars3"></div>
			<div id="stars4"></div>
			<div id="stars5"></div>
		</div>
		<div class="hero-bg-orb"></div>
		<div class="hero-bg-overlay"></div>
	</div>

	<!-- Content -->
	<main class="maintenance-container">
		<div class="maintenance-icon">
			<!-- A minimalist hourglass or orbital icon -->
			<svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
				<circle cx="12" cy="12" r="10"></circle>
				<line x1="12" y1="8" x2="12" y2="12"></line>
				<line x1="12" y1="16" x2="12.01" y2="16"></line>
			</svg>
		</div>
		
		<h1 class="maintenance-title">
			<span class="lang-en">System Upgrade</span>
			<span class="lang-zh">系统升级中</span>
		</h1>
		<h2 class="maintenance-subtitle">
			<span class="lang-en">Temporarily Offline</span>
			<span class="lang-zh">空间站暂时关闭</span>
		</h2>
		<p class="maintenance-desc">
			<span class="lang-en">The archive is currently undergoing a structural update and maintenance. Please check back later.</span>
			<span class="lang-zh">时空档案室正在进行深层架构升级与维护，当前星区暂时无法访问，请稍后再来。</span>
		</p>
		
		<div class="status-badge">
			<span class="lang-en">STATUS: IN PROGRESS</span>
			<span class="lang-zh">状态：升级进行中</span>
		</div>
	</main>

	<!-- Global Footer -->
	<footer class="site-global-footer">
		<p>&copy; 2026 STEVEN ZHANG. ALL RIGHTS RESERVED.</p>
	</footer>

	<!-- Core Libraries -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
	<!-- Language & Parallax Logic -->
	<script src="js/main.js"></script>
</body>
</html>
