<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>STEVEN ZHANG | 404 Lost in Space</title>
	
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;family=Noto+Serif+SC:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
	
	<link rel="stylesheet" href="css/main.css">
	
	<style>
		.not-found-container {
			position: relative;
			z-index: 10;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			text-align: center;
			padding: 2rem;
		}
		
		.error-code {
			font-family: 'Playfair Display', serif;
			font-size: clamp(6rem, 15vw, 12rem);
			font-weight: 600;
			line-height: 1;
			margin-bottom: 1rem;
			background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0) 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			opacity: 0.8;
			letter-spacing: -0.05em;
		}
		
		.error-title {
			font-size: 1.5rem;
			font-weight: 400;
			letter-spacing: 0.2em;
			text-transform: uppercase;
			color: var(--secondary-text-light);
			margin-bottom: 2rem;
		}
		
		.error-desc {
			font-size: 1rem;
			color: #aaa;
			max-width: 400px;
			line-height: 1.6;
			margin-bottom: 3rem;
		}
		
		.return-btn {
			display: inline-block;
			padding: 1rem 2rem;
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 30px;
			color: white;
			text-decoration: none;
			font-size: 0.9rem;
			letter-spacing: 0.1em;
			backdrop-filter: blur(10px);
			transition: all 0.3s ease;
		}
		
		.return-btn:hover {
			background: rgba(255, 255, 255, 0.1);
			transform: translateY(-3px);
			box-shadow: 0 10px 20px rgba(0,0,0,0.3);
		}
	</style>
</head>
<body class="lang-zh">
	
	<!-- Header -->
	<header class="main-header">
		<div class="header-logo">
			<a href="index.html">STEVEN ZHANG</a>
		</div>
		<nav class="header-nav">
			<button id="lang-toggle" class="lang-btn magnetic-btn">
				<span class="lang-en">中文</span>
				<span class="lang-zh">ENGLISH</span>
			</button>
		</nav>
	</header>

	<!-- Deep Space Background -->
	<div class="hero-bg-container">
		<div class="stars-container">
			<div id="stars"></div>
			<div id="stars2"></div>
			<div id="stars3"></div>
			<div id="stars4"></div>
			<div id="stars5"></div>
		</div>
		<div class="hero-bg-orb"></div>
		<div class="hero-bg-overlay"></div>
	</div>

	<!-- Content -->
	<main class="not-found-container">
		<div class="error-code">404</div>
		<h1 class="error-title">
			<span class="lang-en">Lost in Space</span>
			<span class="lang-zh">迷失星际</span>
		</h1>
		<p class="error-desc">
			<span class="lang-en">The transmission was lost. The page you are looking for has drifted beyond the known archive.</span>
			<span class="lang-zh">信号已中断。你要寻找的页面已经漂流到了档案室的边缘之外。</span>
		</p>
		<a href="index.html" class="return-btn">
			<span class="lang-en">RETURN TO HUB</span>
			<span class="lang-zh">返回主星港</span>
		</a>
	</main>

	<!-- Global Footer -->
	<footer class="site-global-footer">
		<p>&copy; 2026 STEVEN ZHANG. ALL RIGHTS RESERVED.</p>
	</footer>

	<!-- Core Libraries -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
	<!-- Language & Parallax Logic -->
	<script src="js/main.js"></script>
</body>
</html>
