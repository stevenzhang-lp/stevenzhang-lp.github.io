<!DOCTYPE html>
<html lang="zh">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>STEVEN ZHANG | ARCHIVE SHARE</title>
	<meta name="description" content="Steven Zhang's shared archive. View photos, diaries, and thoughts.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
	<style>
		/* Custom overrides and layout details for the public share page */
		body {
			opacity: 1 !important;
		}

		.share-container {
			max-width: 1200px;
			margin: 4rem auto;
			padding: 0 2rem;
			width: 100%;
			box-sizing: border-box;
			opacity: 0;
			transform: translateY(20px);
			animation: pageFadeIn 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
		}

		@keyframes pageFadeIn {
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.share-card {
			background: var(--card-bg, #1a1a1a);
			border-radius: 12px;
			box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
			border: 1px solid rgba(255, 255, 255, 0.05);
			overflow: hidden;
			display: flex;
			flex-direction: row;
			align-items: stretch;
			min-height: 600px;
		}

		/* Left Column: Image/Visual Gallery Frame */
		.share-left-column {
			flex: 55;
			background: #111111;
			padding: 3rem;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			border-right: 1px solid rgba(255, 255, 255, 0.05);
			position: relative;
			box-sizing: border-box;
		}

		/* Right Column: Narrative and Info */
		.share-right-column {
			flex: 45;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding: 3.5rem 3rem;
			background: #161616;
			position: relative;
			box-sizing: border-box;
		}

		/* Gallery Frame for image */
		.share-gallery-frame {
			width: 100%;
			background: #181818;
			border: 1px solid rgba(255, 255, 255, 0.03);
			padding: 24px;
			box-sizing: border-box;
			box-shadow: inset 0 0 40px rgba(0,0,0,0.6), 0 15px 35px rgba(0,0,0,0.5);
			border-radius: 4px;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.share-media-container {
			width: 100%;
			overflow: hidden;
			position: relative;
			border: 1px solid rgba(229, 193, 88, 0.25); /* Gold outline */
			background: #000;
			aspect-ratio: 4/3;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.share-media {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
			transition: transform 0.5s ease;
		}

		.share-media-container:hover .share-media {
			transform: scale(1.02);
		}

		/* EXIF info watermark style */
		.share-exif {
			margin-top: 1.5rem;
			width: 100%;
			padding: 0.8rem 1rem;
			background: rgba(255, 255, 255, 0.02);
			border-radius: 4px;
			font-family: 'Courier New', Courier, monospace;
			font-size: 0.75rem;
			letter-spacing: 0.08em;
			color: rgba(255, 255, 255, 0.5);
			border-left: 2px solid var(--accent);
			box-sizing: border-box;
			text-align: center;
		}

		/* Text-only entry art placeholder style */
		.share-text-art {
			width: 100%;
			max-width: 380px;
			aspect-ratio: 1;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			border: 1px dashed rgba(229, 193, 88, 0.15);
			border-radius: 50%;
			padding: 2.5rem;
			text-align: center;
			position: relative;
			background: radial-gradient(circle, rgba(229, 193, 88, 0.03) 0%, transparent 70%);
			box-sizing: border-box;
		}

		.share-text-art::before {
			content: '“';
			font-family: 'Playfair Display', serif;
			font-size: 8rem;
			line-height: 1;
			color: rgba(229, 193, 88, 0.06);
			position: absolute;
			top: 5%;
			left: 10%;
		}

		.share-text-art-title {
			font-family: 'Playfair Display', 'Noto Serif SC', serif;
			font-size: 1.35rem;
			font-weight: 500;
			color: #fff;
			margin-bottom: 1.2rem;
			line-height: 1.4;
		}

		.share-text-art-subtitle {
			font-family: 'Inter', sans-serif;
			font-size: 0.7rem;
			letter-spacing: 0.15em;
			color: var(--accent);
			text-transform: uppercase;
		}

		/* Header Styles */
		.share-card-header {
			margin-bottom: 2rem;
		}

		.share-type-label {
			font-family: 'Inter', sans-serif;
			margin-bottom: 1.5rem;
		}

		.share-type-label .lang-zh,
		.share-type-label .lang-en {
			font-family: 'Inter', sans-serif;
			font-size: 0.8rem;
			letter-spacing: 0.25em;
			color: var(--accent);
			text-transform: uppercase;
			white-space: nowrap;
			line-height: 1.4;
		}

		body.lang-zh .share-type-label .lang-zh {
			display: block !important;
		}
		body.lang-zh .share-type-label .lang-en {
			display: block !important;
			font-size: 0.65rem;
			color: rgba(255, 255, 255, 0.4) !important;
			margin-top: 4px;
			letter-spacing: 0.15em;
		}

		body.lang-en .share-type-label .lang-en {
			display: block !important;
		}
		body.lang-en .share-type-label .lang-zh {
			display: block !important;
			font-size: 0.65rem;
			color: rgba(255, 255, 255, 0.4) !important;
			margin-top: 4px;
			letter-spacing: 0.15em;
		}

		.share-title {
			font-family: 'Playfair Display', 'Noto Serif SC', serif;
			font-size: clamp(1.6rem, 2.5vw, 2.2rem);
			font-weight: 500;
			line-height: 1.35;
			color: #fff;
			margin-bottom: 1rem;
		}

		.share-meta {
			font-family: 'Inter', sans-serif;
			font-size: 0.85rem;
			color: var(--text-muted);
			letter-spacing: 0.05em;
			border-bottom: 1px solid rgba(255, 255, 255, 0.06);
			padding-bottom: 1.2rem;
		}

		/* Story Body styling */
		.share-body-container {
			flex: 1;
			margin-bottom: 2rem;
		}

		.share-body {
			font-size: 1rem;
			line-height: 1.85;
			color: rgba(255, 255, 255, 0.75);
			text-align: justify;
		}

		.share-body .lang-zh {
			white-space: pre-wrap;
		}

		.share-body .lang-en {
			font-style: italic;
			color: rgba(255, 255, 255, 0.5);
			white-space: pre-wrap;
		}

		/* QR Code Section at the bottom */
		.share-qr-section {
			border-top: 1px solid rgba(255, 255, 255, 0.06);
			padding-top: 2rem;
			display: flex;
			align-items: center;
			justify-content: space-between;
			background: transparent;
			gap: 1.5rem;
		}

		.share-qr-text {
			flex: 1;
		}

		.share-qr-text h4 {
			font-family: 'Inter', sans-serif;
			font-size: 0.9rem;
			color: #fff;
			margin-bottom: 0.4rem;
			letter-spacing: 0.05em;
			font-weight: 500;
		}

		.share-qr-text p {
			font-size: 0.75rem;
			color: var(--text-muted);
			line-height: 1.5;
			margin: 0;
		}

		.share-qr-code {
			width: 88px;
			height: 88px;
			background: #fff;
			padding: 5px;
			border-radius: 4px;
			display: flex;
			justify-content: center;
			align-items: center;
			flex-shrink: 0;
			box-shadow: 0 4px 15px rgba(0,0,0,0.3);
			border: 1px solid rgba(229, 193, 88, 0.3); /* gold subtle border */
		}

		.share-qr-code img {
			width: 100% !important;
			height: 100% !important;
		}

		/* Error container style */
		.share-error-container {
			text-align: center;
			padding: 8rem 2rem;
		}

		.share-error-title {
			font-family: 'Playfair Display', 'Noto Serif SC', serif;
			font-size: 2.5rem;
			color: var(--accent);
			margin-bottom: 1.5rem;
		}

		.share-error-text {
			color: var(--text-muted);
			margin-bottom: 2.5rem;
		}

		.share-btn-home {
			display: inline-block;
			background: transparent;
			border: 1px solid var(--accent);
			color: var(--accent);
			padding: 0.8rem 2rem;
			border-radius: 20px;
			text-decoration: none;
			letter-spacing: 0.1em;
			font-size: 0.85rem;
			transition: all 0.3s;
		}

		.share-btn-home:hover {
			background: var(--accent);
			color: #000;
		}

		.share-explore-action {
			margin-top: 1.5rem;
			margin-bottom: 0.5rem;
			display: flex;
			justify-content: flex-start;
		}

		.share-explore-btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			background: transparent;
			border: 1px solid var(--accent, #e5c158);
			color: var(--accent, #e5c158);
			padding: 0.75rem 1.8rem;
			border-radius: 24px;
			text-decoration: none;
			font-family: 'Inter', sans-serif;
			font-size: 0.8rem;
			letter-spacing: 0.1em;
			font-weight: 500;
			text-transform: uppercase;
			transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
			cursor: pointer;
		}

		.share-explore-btn:hover {
			background: var(--accent, #e5c158);
			color: #000;
			transform: translateY(-2px);
			box-shadow: 0 4px 15px rgba(229, 193, 88, 0.2);
		}

		.share-explore-btn:active {
			transform: translateY(0);
		}

		@media (max-width: 991px) {
			.share-container {
				margin: 2rem auto;
				padding: 0 1.5rem;
			}

			.share-card {
				flex-direction: column;
				min-height: auto;
			}

			.share-left-column {
				border-right: none;
				border-bottom: 1px solid rgba(255, 255, 255, 0.05);
				padding: 2.5rem;
			}

			.share-right-column {
				padding: 2.5rem 2rem;
			}

			.share-gallery-frame {
				padding: 16px;
			}
		}

		@media (max-width: 480px) {
			.share-container {
				margin: 1rem auto;
				padding: 0 1rem;
			}

			.share-left-column {
				padding: 1.5rem 1rem;
			}

			.share-right-column {
				padding: 2rem 1.5rem;
			}

			.share-title {
				font-size: 1.5rem;
			}

			.share-qr-section {
				flex-direction: column;
				align-items: center;
				text-align: center;
				gap: 1.2rem;
			}

			.share-explore-action {
				justify-content: center;
			}
		}
	</style>
</head>

<body>

	<!-- Header -->
	<header class="site-header">
		<h1 class="logo">
			<a href="index.html" style="color: inherit; text-decoration: none;">STEVEN ZHANG</a>
			<span class="site-subtitle">
				<span class="lang-en">| SHARED ARCHIVE</span>
				<span class="lang-zh">| 分享档案</span>
			</span>
		</h1>
		<nav class="main-nav">
			<a href="index.html" class="nav-link">
				<span class="lang-en">THE HUB</span>
				<span class="lang-zh">返回主站</span>
			</a>
			<a href="#" id="lang-toggle" class="lang-toggle-text">
				<span class="lang-en">中文</span>
				<span class="lang-zh">ENGLISH</span>
			</a>
		</nav>
	</header>

	<!-- Main Share Container -->
	<main class="share-container" id="share-content">
		<!-- Content will be injected dynamically -->
		<div class="share-error-container" id="loading-spinner">
			<h2 class="share-error-title" style="font-size: 1.8rem;">
				<span class="lang-zh">加载中...</span>
				<span class="lang-en">Loading...</span>
			</h2>
		</div>
	</main>

	<!-- Footer -->
	<footer class="site-footer">
		<div class="footer-content">
			<p>&copy; 2026 Steven Zhang. All Rights Reserved.</p>
			<ul class="footer-links">
				<li><a href="https://instagram.com/zhang.lp.28" target="_blank">Instagram</a></li>
				<li><a href="https://v.douyin.com/WNPNUeIn-lg/" target="_blank">
						<span class="lang-en">Douyin</span>
						<span class="lang-zh">抖音</span>
					</a></li>
			</ul>
		</div>
	</footer>

	<!-- Data source and QR Code Generator -->
	<script src="js/data.js"></script>
	<script src="js/qrcode.min.js"></script>
	<script>
		// Disable right-click context menu on share page
		document.addEventListener('contextmenu', e => e.preventDefault());

		document.addEventListener('DOMContentLoaded', () => {
			// Language Toggle Logic
			const langToggle = document.getElementById('lang-toggle');
			let currentLang = localStorage.getItem('voyage_lang') || 'zh';
			document.body.classList.remove('lang-zh', 'lang-en');
			document.body.classList.add(`lang-${currentLang}`);

			// Prevent Flash of Unstyled Text (FOUT) and ensure transition starts from opacity: 0
			setTimeout(() => {
				if (document.fonts) {
					document.fonts.ready.then(() => {
						document.body.classList.add('fonts-loaded');
					});
					setTimeout(() => {
						document.body.classList.add('fonts-loaded');
					}, 1000);
				} else {
					document.body.classList.add('fonts-loaded');
				}
			}, 80);

			function updatePageTitle(item, type) {
				const suffixEn = type ? ` | ${type.toUpperCase()}` : '';
				const suffixZh = type ? ` | ${type === 'voyage' ? '摄影' : type === 'diary' ? '日记' : '随笔'}` : '';
				
				if (item) {
					document.title = currentLang === 'en' 
						? `STEVEN ZHANG | ${item.titleEn || 'Shared'}${suffixEn}` 
						: `STEVEN ZHANG | ${item.titleZh || '分享'}${suffixZh}`;
				} else {
					document.title = currentLang === 'en' ? "STEVEN ZHANG | ARCHIVE SHARE" : "STEVEN ZHANG | 分享档案";
				}
			}

			if (langToggle) {
				langToggle.addEventListener('click', (e) => {
					e.preventDefault();
					let newLang = document.body.classList.contains('lang-zh') ? 'en' : 'zh';
					document.body.classList.remove('lang-zh', 'lang-en');
					document.body.classList.add(`lang-${newLang}`);
					localStorage.setItem('voyage_lang', newLang);
					currentLang = newLang;
					updatePageTitle(currentItem, currentType);
				});
			}

			// Render shared item logic
			const container = document.getElementById('share-content');
			const urlParams = new URLSearchParams(window.location.search);
			const currentType = urlParams.get('type');
			const idParam = urlParams.get('id');
			let currentItem = null;

			if (!currentType || !idParam) {
				showError();
				return;
			}

			const id = parseInt(idParam);

			if (currentType === 'voyage' && typeof photos !== 'undefined') {
				currentItem = photos.find(p => p.id === id);
			} else if (currentType === 'diary' && typeof diaries !== 'undefined') {
				currentItem = diaries.find(d => d.id === id);
			} else if (currentType === 'journal' && typeof journals !== 'undefined') {
				currentItem = journals.find(j => j.id === id);
			}

			if (!currentItem) {
				showError();
				return;
			}

			// Update title and render card
			updatePageTitle(currentItem, currentType);
			renderCard(currentItem, currentType);

			function showError() {
				updatePageTitle(null, null);
				container.innerHTML = `
					<div class="share-error-container">
						<h2 class="share-error-title">404</h2>
						<p class="share-error-text">
							<span class="lang-zh">抱歉，未找到该分享档案或链接已失效。</span>
							<span class="lang-en">Sorry, the shared archive was not found or the link has expired.</span>
						</p>
						<a href="index.html" class="share-btn-home">
							<span class="lang-zh">返回主站</span>
							<span class="lang-en">BACK TO HUB</span>
						</a>
					</div>
				`;
			}

			function renderCard(item, type) {
				let typeLabelZh = '';
				let typeLabelEn = '';
				let metaZh = '';
				let metaEn = '';
				let imageHtml = '';
				let bodyHtml = '';
				let exifHtml = '';

				if (type === 'voyage') {
					typeLabelZh = '时空档案 · 摄影';
					typeLabelEn = 'Voyage Archive · Photo';
					
					const dateLoc = typeof parseDate === 'function' ? parseDate(item.date) : { en: item.date, zh: item.date };
					const loc = typeof parseLocation === 'function' ? parseLocation(item.location) : { enSub: item.location, zhSub: item.location };
					metaZh = `${loc.zhSub} | ${dateLoc.zh}`;
					metaEn = `${loc.enSub} | ${dateLoc.en}`;

					if (item.image) {
						imageHtml = `
							<div class="share-media-container">
								<img src="${item.image}" alt="${item.titleEn}" class="share-media">
							</div>
						`;
					}

					bodyHtml = `
						<div class="share-body">
							<div class="lang-zh">${item.storyZh || ''}</div>
							<div class="lang-en">${item.storyEn || ''}</div>
						</div>
					`;
				} else if (type === 'diary') {
					typeLabelZh = '日常切片 · 随笔';
					typeLabelEn = 'Daily Fragments · Diary';
					
					const catZh = item.categoryZh ? `${item.categoryZh} | ` : '';
					const catEn = item.categoryEn ? `${item.categoryEn} | ` : '';
					metaZh = `${catZh}${item.date}`;
					metaEn = `${catEn}${item.date}`;

					if (item.image) {
						imageHtml = `
							<div class="share-media-container">
								<img src="${item.image}" alt="${item.titleEn}" class="share-media">
							</div>
						`;
					}

					bodyHtml = `
						<div class="share-body">
							<div class="lang-zh">${item.contentZh || ''}</div>
							<div class="lang-en">${item.contentEn || ''}</div>
						</div>
					`;

					if (item.exif) {
						exifHtml = `
							<div class="share-exif">
								${item.exif}
							</div>
						`;
					}
				} else if (type === 'journal') {
					typeLabelZh = '思维碎片 · 沉淀';
					typeLabelEn = 'Thought Fragments · Journal';
					
					const catZh = item.categoryZh ? `${item.categoryZh} | ` : '';
					const catEn = item.categoryEn ? `${item.categoryEn} | ` : '';
					metaZh = `${catZh}${item.date}`;
					metaEn = `${catEn}${item.date}`;

					bodyHtml = `
						<div class="share-body">
							<div class="lang-zh">${item.contentZh || ''}</div>
							<div class="lang-en">${item.contentEn || ''}</div>
						</div>
					`;
				}

				container.innerHTML = `
					<div class="share-card">
						<!-- Left Side: Gallery Frame + Specifications -->
						<div class="share-left-column">
							${imageHtml ? `
								<div class="share-gallery-frame">
									${imageHtml}
								</div>
							` : `
								<div class="share-text-art">
									<h4 class="share-text-art-title">
										<span class="lang-zh">${item.titleZh || ''}</span>
										<span class="lang-en">${item.titleEn || ''}</span>
									</h4>
									<span class="share-text-art-subtitle">
										<span class="lang-zh">${typeLabelZh}</span>
										<span class="lang-en">${typeLabelEn}</span>
									</span>
								</div>
							`}
							${exifHtml}
						</div>
						
						<!-- Right Side: Details & Action -->
						<div class="share-right-column">
							<div class="share-right-top">
								<div class="share-card-header">
									<div class="share-type-label">
										<span class="lang-zh">${typeLabelZh}</span>
										<span class="lang-en">${typeLabelEn}</span>
									</div>
									<h2 class="share-title">
										<span class="lang-zh">${item.titleZh || ''}</span>
										<span class="lang-en">${item.titleEn || ''}</span>
									</h2>
									<div class="share-meta">
										<span class="lang-zh">${metaZh}</span>
										<span class="lang-en">${metaEn}</span>
									</div>
								</div>
								
								<div class="share-body-container">
									${bodyHtml}
								</div>
								
								<div class="share-explore-action">
									<a href="${type}.html?id=${item.id}" class="share-explore-btn">
										<span class="lang-zh">进入页面互动探索 &rarr;</span>
										<span class="lang-en">EXPLORE IN ARCHIVE &rarr;</span>
									</a>
								</div>
							</div>

							<!-- Page QR Code Footer -->
							<div class="share-qr-section">
								<div class="share-qr-text">
									<h4>
										<span class="lang-zh">时空档案的分享坐标</span>
										<span class="lang-en">Shared Coordinates of Time</span>
									</h4>
									<p>
										<span class="lang-zh">您正在浏览 Steven Zhang 的个人分享页面。扫描右侧二维码，或使用该链接随时随地打开并探索该项目详情。</span>
										<span class="lang-en">You are viewing a shared archive from Steven Zhang. Scan the QR code to open and explore the details of this project at any time.</span>
									</p>
								</div>
								<div class="share-qr-code" id="page-qrcode"></div>
							</div>
						</div>
					</div>
				`;

				// Generate the QR Code dynamically pointing back to this exact page
				const shareUrl = window.location.href;
				const qrContainer = document.getElementById('page-qrcode');
				
				if (typeof QRCode !== 'undefined') {
					qrContainer.innerHTML = '';
					new QRCode(qrContainer, {
						text: shareUrl,
						width: 88,
						height: 88,
						colorDark: '#000000',
						colorLight: '#ffffff',
						correctLevel: QRCode.CorrectLevel.M
					});
				} else {
					// Fallback if library failed to load
					qrContainer.innerHTML = `<span style="font-size: 0.6rem; color: #000; text-align: center;">Scan Me</span>`;
				}
			}
		});
	</script>
</body>

</html>
